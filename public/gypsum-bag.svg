<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Gypsum bag shape -->
  <defs>
    <linearGradient id="bagGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main bag body -->
  <path d="M 8 8 Q 8 6 10 6 L 22 6 Q 24 6 24 8 L 24 24 Q 24 28 20 28 L 12 28 Q 8 28 8 24 Z" 
        fill="url(#bagGradient)" 
        stroke="#999" 
        stroke-width="1"/>
  
  <!-- Bag top fold -->
  <rect x="9" y="6" width="14" height="3" fill="#d0d0d0" stroke="#999" stroke-width="0.5"/>
  
  <!-- Text/label on bag -->
  <rect x="11" y="13" width="10" height="8" fill="#fff" stroke="#999" stroke-width="0.5" rx="1"/>
  
  <!-- Decorative lines on label -->
  <line x1="13" y1="16" x2="19" y2="16" stroke="#666" stroke-width="0.8"/>
  <line x1="13" y1="18.5" x2="19" y2="18.5" stroke="#666" stroke-width="0.8"/>
  
  <!-- Shadow/depth effect -->
  <ellipse cx="16" cy="27.5" rx="6" ry="1.5" fill="#00000020"/>
</svg>
